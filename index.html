<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <title>Audio Visualizer</title>

    <!-- Inline theme bootstrap: prevents flash of wrong theme on reload. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('audiovisualizer:theme') || 'dark';
          if (mode !== 'dark' && mode !== 'light') mode = 'dark';
          document.documentElement.dataset.theme = mode;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- Favicon: Audio Visualizer brand mark. -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Fonts: Space Grotesk (display + UI) + JetBrains Mono (numbers/code). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
